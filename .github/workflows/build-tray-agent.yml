name: Build RMM Agent

on:
  push:
    branches:
      - main
    paths:
      - 'resources/tauri/tray-template/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $content = Get-Content "resources/tauri/tray-template/src-tauri/Cargo.toml" -Raw
          if ($content -match 'version\s*=\s*"([^"]+)"') {
            $version = $matches[1]
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
            echo "Extracted version: $version"
          } else {
            echo "Failed to extract version"
            exit 1
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "resources/tauri/tray-template/src-tauri -> target"

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Install WiX Toolset
        run: |
          # Download WiX 3.14 (required by cargo-wix)
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:USERPROFILE\.wix"
          echo "$env:USERPROFILE\.wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Release Binary
        working-directory: resources/tauri/tray-template/src-tauri
        run: cargo build --release

      - name: Run Tests
        working-directory: resources/tauri/tray-template/src-tauri
        run: cargo test --release

      # Agents refuse to auto-update unless rmm.exe matches this checksum
      - name: Generate rmm.exe SHA-256
        shell: pwsh
        working-directory: resources/tauri/tray-template/src-tauri/target/release
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath rmm.exe).Hash.ToLowerInvariant()
          if ($hash -notmatch '^[0-9a-f]{64}$') { throw "Unexpected hash: $hash" }
          Set-Content -LiteralPath rmm.exe.sha256 -Value "$hash  rmm.exe" -NoNewline -Encoding ascii
          Write-Host "rmm.exe SHA-256: $hash"

      - name: Convert PNG to ICO
        run: magick resources/tauri/tray-template/src-tauri/icons/icon.png -define icon:auto-resize=256,128,64,48,32,16 resources/tauri/tray-template/src-tauri/icons/icon.ico

      - name: Build MSI
        working-directory: resources/tauri/tray-template/src-tauri
        run: cargo wix --no-build --nocapture

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmm-agent-msi
          path: resources/tauri/tray-template/src-tauri/target/wix/*.msi
          retention-days: 90

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmm-agent-exe
          path: |
            resources/tauri/tray-template/src-tauri/target/release/rmm.exe
            resources/tauri/tray-template/src-tauri/target/release/rmm.exe.sha256
          retention-days: 90

  # Read-only monitoring agent for Linux servers/LXCs: one static musl binary
  # (no OpenSSL; reqwest uses rustls), never runs commands.
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "resources/tauri/tray-template/src-tauri -> target"

      - name: Run Tests
        working-directory: resources/tauri/tray-template/src-tauri
        run: cargo test --release

      - name: Build static binary
        working-directory: resources/tauri/tray-template/src-tauri
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target x86_64-unknown-linux-musl

      # Agents refuse to auto-update unless the binary matches this checksum
      - name: Package binary and SHA-256
        working-directory: resources/tauri/tray-template/src-tauri
        run: |
          mkdir -p dist-linux
          cp target/x86_64-unknown-linux-musl/release/rmm dist-linux/rmm-linux-x86_64
          chmod 755 dist-linux/rmm-linux-x86_64
          cd dist-linux
          file rmm-linux-x86_64
          # ldd exits 0 on static-pie binaries too, so trust file's verdict instead.
          if ! file rmm-linux-x86_64 | grep -Eq 'statically linked|static-pie linked'; then
            echo "rmm-linux-x86_64 is not statically linked" >&2
            exit 1
          fi
          ./rmm-linux-x86_64 --version
          sha256sum rmm-linux-x86_64 > rmm-linux-x86_64.sha256
          cat rmm-linux-x86_64.sha256

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmm-agent-linux
          path: |
            resources/tauri/tray-template/src-tauri/dist-linux/rmm-linux-x86_64
            resources/tauri/tray-template/src-tauri/dist-linux/rmm-linux-x86_64.sha256
          retention-days: 90

  # One release with every platform's assets, created only once both builds
  # (and their tests) have passed.
  release:
    if: github.ref == 'refs/heads/main'
    needs: [build, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -la dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: RMM Agent v${{ needs.build.outputs.version }}
          files: |
            dist/*.msi
            dist/rmm.exe
            dist/rmm.exe.sha256
            dist/rmm-linux-x86_64
            dist/rmm-linux-x86_64.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            ## RMM Agent v${{ needs.build.outputs.version }}

            ### Downloads
            - **MSI Installer** - For fresh Windows installations
            - **rmm.exe** - For Windows auto-updates (agents download this automatically)
            - **rmm.exe.sha256** - SHA-256 of rmm.exe; agents refuse updates that do not match
            - **rmm-linux-x86_64** - Static Linux agent (read-only monitoring, never runs commands)
            - **rmm-linux-x86_64.sha256** - SHA-256 of the Linux agent

            ### Installation
            Windows - run the MSI installer or use PowerShell:
            ```powershell
            irm https://your-server/agent/install.ps1 | iex
            ```

            Linux - as root:
            ```sh
            curl -fsSL https://your-server/agent/install.sh | sh
            ```

            ### After Installation
            The `rmm` command will be available in PATH:
            ```powershell
            # Run from an elevated (Administrator) prompt, or with sudo on Linux
            rmm status           # Show agent status
            rmm update --check   # Check for updates
            rmm --url <URL>      # Set server URL
            rmm --reset          # Clear API key
            ```
