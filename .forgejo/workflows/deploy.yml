name: Test & Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction --prefer-dist
          npm ci && npm run build

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php -d memory_limit=2G vendor/bin/pest --parallel

  deploy:
    runs-on: self-hosted
    needs: test
    steps:
      - name: Wait for the GitHub mirror
        run: |
          for attempt in $(seq 30); do
            [ "$(git ls-remote https://github.com/benjameshughes/rmm.git main | cut -f1)" = "${{ github.sha }}" ] && exit 0
            echo "Waiting for the GitHub mirror..."
            sleep 10
          done
          echo "GitHub never got ${{ github.sha }}"
          exit 1

      - name: Deploy to production
        run: |
          ssh -o StrictHostKeyChecking=no -i /home/runner/.ssh/deploy_key deploy@10.0.60.205 sudo -n /usr/local/bin/rmm-deploy | tee deploy.log
          grep -q "rmm deployed: $(echo ${{ github.sha }} | cut -c1-7)" deploy.log
