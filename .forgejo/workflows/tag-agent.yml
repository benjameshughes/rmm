name: Tag Agent Release

on:
  push:
    branches: [main]
    paths:
      - 'resources/tauri/tray-template/**'

jobs:
  tag:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the agent version on Fridge
        run: |
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' resources/tauri/tray-template/src-tauri/Cargo.toml | head -1)
          test -n "$version" || { echo "Couldn't read the agent version from Cargo.toml"; exit 1; }
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to release (bump the version in Cargo.toml to release)"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "Pushed $tag; the GitHub mirror carries it over and GitHub builds the release"
